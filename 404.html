  <title>Rest Countries</title>
  <base href="/rest-countries-api-with-color-theme-switcher-master/">
  <script>
    const fallbackUrl = new URLSearchParams(window.location.search).get('__ghpages');
    const basePath = '/rest-countries-api-with-color-theme-switcher-master/';

    if (fallbackUrl) {
      const restoredUrl = new URL(fallbackUrl, window.location.origin);

      if (restoredUrl.origin === window.location.origin && restoredUrl.pathname.startsWith(basePath)) {
        window.history.replaceState(
          null,
          '',
          restoredUrl.pathname + restoredUrl.search + restoredUrl.hash
        );
      }
    }
  </script>
